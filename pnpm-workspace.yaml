packages:
  - '.'
allowBuilds:
  # postinstall only fetches an unused PowerSync binary
  '@journeyapps/wa-sqlite': false
  esbuild: true
  lightningcss: true
patchedDependencies:
  '@tanstack/solid-db': patches/@tanstack__solid-db.patch
permissions:
  '@electric-sql/client':
    skills: true
  '@tanstack/db':
    skills: true
  '@tanstack/devtools-vite':
    skills: true
  '@tanstack/offline-transactions':
    skills: true
  '@tanstack/solid-db':
    skills: true
  '@tanstack/solid-router':
    skills: true
  '@tanstack/solid-start':
    skills: true
  drizzle-kit:
    skills: true
